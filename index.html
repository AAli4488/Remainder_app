<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bunny Reminders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ffc9d9; --pink-soft:#ffe3ec; --pink-bg:#ffd3e0; --rose:#ff8fb1; --rose-deep:#e8588b;
  --ink:#5a4a6a; --blue:#6b82d6; --cream:#f6f2c9; --white:#fffafc; --lav:#d9d2f5; --mint:#cdeee0;
  --shadow:0 10px 30px rgba(232,88,139,.18);
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  font-family:'Quicksand',system-ui,sans-serif; color:var(--ink);
  background-color:var(--pink-bg);
  background-image:
    linear-gradient(rgba(255,255,255,.45) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.45) 1px,transparent 1px);
  background-size:26px 26px;
  padding:28px 16px 60px;
}
.frame{
  max-width:900px;margin:0 auto;position:relative;
  background:var(--white);border-radius:28px;padding:34px 30px 30px;
  box-shadow:var(--shadow);
  /* postage-stamp edge */
  border:10px solid #fff;
  outline:3px dotted #ffb3cb;outline-offset:-3px;
}
.deco{position:absolute;font-size:34px;user-select:none;pointer-events:none}
.d1{left:-6px;top:-26px;transform:rotate(-12deg);font-size:44px}
.d2{right:-4px;top:-24px;transform:rotate(14deg);font-size:42px}
.d3{left:18px;bottom:-26px;font-size:36px}
.d4{right:22px;bottom:-24px;font-size:36px}
header{text-align:center;margin-bottom:22px}
header img{width:130px;display:block;margin:-6px auto 0;border-radius:12px;
  -webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
h1{font-family:'Gaegu','Segoe Print','Comic Sans MS',cursive;font-size:2.7rem;color:var(--rose-deep);letter-spacing:1px;line-height:1}
.sub{font-weight:600;color:#9a86b0;margin-top:4px}
#clock{font-family:'Gaegu','Segoe Print','Comic Sans MS',cursive;font-size:1.3rem;color:var(--blue);margin-top:6px}

.panel{background:var(--pink-soft);border-radius:22px;padding:20px;margin-bottom:22px;border:2px solid #fff;
  box-shadow:inset 0 0 0 2px #ffd0de}
.panel h2{font-family:'Gaegu','Segoe Print','Comic Sans MS',cursive;font-size:1.6rem;color:var(--blue);margin-bottom:10px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:.8rem;font-weight:700;color:#a07fa8;gap:5px;flex:1;min-width:120px}
input,select{
  font:inherit;font-weight:600;color:var(--ink);background:#fff;border:2px solid #ffc2d5;border-radius:14px;
  padding:10px 12px;outline:none;transition:.15s;width:100%;
}
input:focus,select:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(255,143,177,.25)}
.timebox{display:flex;gap:6px}
.btn{
  font:inherit;font-weight:700;border:none;cursor:pointer;border-radius:999px;padding:11px 24px;
  background:linear-gradient(135deg,#ff9bbb,#ff7aa6);color:#fff;box-shadow:0 6px 14px rgba(255,122,166,.4);
  transition:transform .12s,box-shadow .12s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 9px 18px rgba(255,122,166,.45)}
.btn:active{transform:translateY(0)}
.btn:disabled{background:#e6d6dd;box-shadow:none;cursor:not-allowed;transform:none}
.btn.ghost{background:#fff;color:var(--rose-deep);box-shadow:none;border:2px solid #ffc2d5}
.btn.small{padding:7px 14px;font-size:.85rem}
.hint{font-size:.8rem;color:#a58fb5;margin-top:10px;font-weight:600}
.hint b{color:var(--rose-deep)}

.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{font:inherit;font-weight:700;border:2px solid #ffc2d5;background:#fff;color:#c27a97;border-radius:999px;padding:7px 18px;cursor:pointer}
.tab.on{background:var(--rose);color:#fff;border-color:var(--rose)}
.list{display:grid;gap:12px}
.task{
  display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px 16px;
  border:2px solid #ffe0ea;box-shadow:0 4px 12px rgba(255,143,177,.12);animation:pop .3s ease;
}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.dot{width:34px;height:34px;border-radius:12px;background:var(--cream);border:3px solid #f3b6c9;flex:none;display:grid;place-items:center;font-size:18px}
.task.done .dot{background:var(--mint);border-color:#9ed8bd}
.info{flex:1;min-width:0}
.t-title{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.task.done .t-title{text-decoration:line-through;color:#a99bb8}
.t-meta{font-size:.82rem;color:#a58fb5;font-weight:600;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.badge{background:var(--lav);color:#6d5fa6;border-radius:999px;padding:1px 10px;font-size:.72rem;font-weight:700}
.badge.late{background:#ffd0d6;color:#c23b5b}
.thumb{width:46px;height:46px;border-radius:12px;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:zoom-in}
.x{background:none;border:none;font-size:18px;cursor:pointer;opacity:.5;padding:6px}
.x:hover{opacity:1}
.empty{text-align:center;padding:28px 10px;color:#b49ac2;font-family:'Gaegu','Segoe Print','Comic Sans MS',cursive;font-size:1.4rem}

/* ---------- full-screen popup ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;
  background:rgba(255,170,200,.55);backdrop-filter:blur(6px);overflow:auto}
.overlay.show{display:grid;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pop{width:min(620px,94vw);text-align:center}

  text-align:center;font-family:'Gaegu','Segoe Print','Comic Sans MS',cursive;font-weight:700;color:#3f4f9a;line-height:1.1;
  font-size:3.2cqw;overflow:hidden;overflow-wrap:anywhere;
}
.pop .btn{margin-top:16px;font-size:1.1rem;padding:13px 34px}
.more{margin-top:10px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(200,60,110,.6)}
.paper{background:var(--white);border-radius:26px;padding:26px 26px 22px;width:min(440px,94vw);text-align:center;
  border:8px solid #fff;outline:3px dotted #ffb3cb;outline-offset:-3px;box-shadow:0 20px 50px rgba(200,60,110,.35)}
.paper h3{font-family:'Gaegu','Segoe Print','Comic Sans MS',cursive;font-size:2rem;color:var(--rose-deep)}
.paper .task-name{color:var(--blue);font-weight:700;margin:4px 0 14px}
.drop{display:grid;place-items:center;min-height:190px;border:3px dashed #ffb3cb;border-radius:20px;background:var(--pink-soft);
  cursor:pointer;color:#c27a97;font-weight:700;overflow:hidden;transition:.15s}
.drop:hover{background:#ffdbe7}
.drop img{max-width:100%;max-height:260px;display:block}
.drop .big{font-size:2.4rem;display:block}
.actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:18px;border:6px solid #fff}
.confetti{position:fixed;top:-20px;font-size:24px;z-index:80;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
@media(max-width:560px){.frame{padding:26px 16px}h1{font-size:2.2rem}}
</style>
</head>
<body>
<div class="frame">
  <span class="deco d1"></span><span class="deco d2"></span><span class="deco d3"></span><span class="deco d4"></span>
  <header>
    <div style="font-size:54px;line-height:1">🐰</div>
    <h1>my cute reminders</h1>
    <div class="sub">stay on track, one tiny task at a time ♡</div>
    <div id="clock"></div>
  </header>

  <section class="panel">
    <h2>✎ new task</h2>
    <div class="row">
      <label style="flex:3;min-width:220px">What should I remind you?
        <input id="title" maxlength="80" placeholder="e.g. Drink water, finish homework…" autocomplete="off">
      </label>
    </div>
    <div class="row" style="margin-top:12px">
      <label>Date <input type="date" id="date"></label>
      <label>Time (6:00 AM – 11:59 PM)
        <div class="timebox"><select id="hour"></select><select id="min"></select></div>
      </label>
      <label>Repeat
        <select id="repeat"><option>Never</option><option>Daily</option><option>Weekly</option></select>
      </label>
      <button class="btn" id="add">＋ Add</button>
    </div>
    <div class="hint" id="notifHint"></div>
  </section>

  <div class="tabs">
    <button class="tab on" data-tab="pending">🌸 Pending</button>
    <button class="tab" data-tab="done">✅ Completed</button>
  </div>
  <div class="list" id="list"></div>
  <p class="hint" style="text-align:center;margin-top:20px">
    💡 Keep this tab open (it can sit minimized). For a real desktop-app feel, use the browser's
    <b>Install app / Create shortcut → Open as window</b> option.
  </p>
</div>

<!-- reminder popup -->
<div class="overlay" id="remind">
  <div class="pop">
    <div class="bunny"><div class="card-text" id="rText"></div></div>
    <button class="btn" id="rDone">✔ Mark as completed</button>
    <div class="more" id="rMore"></div>
  </div>
</div>

<!-- proof page -->
<div class="overlay" id="proof">
  <div class="paper">
    <h3>📸 show me your proof!</h3>
    <div class="task-name" id="pName"></div>
    <label class="drop" id="drop" for="file">
      <span id="dropInner"><span class="big">🖼️</span>Tap to choose or take a photo</span>
    </label>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="actions">
      <button class="btn ghost" id="pCancel">Back</button>
      <button class="btn" id="pSubmit" disabled>Submit &amp; complete ✨</button>
    </div>
  </div>
</div>

<div class="overlay lightbox" id="lightbox"><img id="lbImg" alt=""></div>

<script>
(() => {
  const KEY = 'bunny_reminders_v1';
  const $ = id => document.getElementById(id);
  let tasks = [];
  let tab = 'pending';
  let proofFor = null, proofData = null;
  const shownNotif = new Set();

  /* ---------- storage ---------- */
  function load(){ try{ tasks = JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ tasks = []; } }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(tasks)); }
    catch(e){ alert('Storage is full – try deleting some old completed tasks.'); }
  }
  const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

  /* ---------- form setup ---------- */
  const pad = n => String(n).padStart(2,'0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  function fmtHour(h){ return `${h%12||12} ${h<12?'AM':'PM'}`; }
  for(let h=6; h<=23; h++){ $('hour').add(new Option(fmtHour(h), h)); }
  for(let m=0; m<60; m++){ $('min').add(new Option(pad(m), m)); }
  (function defaults(){
    let d = new Date(Date.now()+5*60000);
    if(d.getHours()<6){ d.setHours(6,0,0,0); }
    $('date').value = ymd(d); $('date').min = ymd(new Date());
    $('hour').value = d.getHours(); $('min').value = d.getMinutes();
  })();

  $('add').onclick = addTask;
  $('title').addEventListener('keydown', e => { if(e.key==='Enter') addTask(); });
  function addTask(){
    const title = $('title').value.trim();
    if(!title){ $('title').focus(); $('title').style.borderColor='#e8588b'; return; }
    if(!$('date').value){ $('date').focus(); return; }
    const [y,mo,da] = $('date').value.split('-').map(Number);
    const due = new Date(y, mo-1, da, +$('hour').value, +$('min').value);
    tasks.push({id:uid(), title, due:due.getTime(), repeat:$('repeat').value, done:false});
    save(); $('title').value=''; $('title').style.borderColor='';
    askNotifPermission(); tab='pending'; syncTabs(); render(); tick();
  }

  /* ---------- rendering ---------- */
  const fmtDue = ms => new Date(ms).toLocaleString(undefined,{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
  function render(){
    const list = $('list'); list.innerHTML='';
    const now = Date.now();
    const items = tasks.filter(t => tab==='done' ? t.done : !t.done)
      .sort((a,b)=> tab==='done' ? (b.completedAt||0)-(a.completedAt||0) : a.due-b.due);
    if(!items.length){
      list.innerHTML = `<div class="empty">${tab==='done' ? 'nothing completed yet ✿' : 'no pending tasks – add one above ♡'}</div>`;
      return;
    }
    for(const t of items){
      const el = document.createElement('div');
      el.className = 'task' + (t.done?' done':'');
      const late = !t.done && t.due < now;
      el.innerHTML = `
        <div class="dot">${t.done?'✓':''}</div>
        <div class="info">
          <div class="t-title"></div>
          <div class="t-meta"><span>⏰ ${fmtDue(t.due)}</span>
            ${t.repeat!=='Never' ? `<span class="badge">🔁 ${t.repeat}</span>`:''}
            ${late ? '<span class="badge late">overdue</span>':''}</div>
        </div>`;
      el.querySelector('.t-title').textContent = t.title;
      if(t.done && t.proof){
        const im = document.createElement('img'); im.className='thumb'; im.src=t.proof; im.title='View proof';
        im.onclick = () => { $('lbImg').src = t.proof; $('lightbox').classList.add('show'); };
        el.appendChild(im);
      }
      if(!t.done){
        const b = document.createElement('button'); b.className='btn small'; b.textContent='Done';
        b.onclick = () => openProof(t.id); el.appendChild(b);
      }
      const x = document.createElement('button'); x.className='x'; x.textContent='🗑️'; x.title='Delete';
      x.onclick = () => { if(confirm('Delete this task?')){ tasks = tasks.filter(z=>z.id!==t.id); save(); render(); tick(); } };
      el.appendChild(x);
      list.appendChild(el);
    }
  }
  function syncTabs(){ document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab)); }
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab=b.dataset.tab; syncTabs(); render(); });
  $('lightbox').onclick = () => $('lightbox').classList.remove('show');

  /* ---------- reminder popup (stays until completed) ---------- */
  function dueTasks(){ return tasks.filter(t => !t.done && t.due <= Date.now()).sort((a,b)=>a.due-b.due); }
  function tick(){
    $('clock').textContent = new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'});
    const due = dueTasks();
    const proofOpen = $('proof').classList.contains('show');
    if(due.length){
      const t = due[0];
      $('rText').textContent = t.title;
      $('rMore').textContent = due.length>1 ? `+ ${due.length-1} more waiting ♡` : '';
      $('rDone').onclick = () => openProof(t.id);
      if(!shownNotif.has(t.id)){ shownNotif.add(t.id); alertUser(t); }
      if(!proofOpen) $('remind').classList.add('show');
    } else {
      $('remind').classList.remove('show');
      document.title = 'Bunny Reminders';
    }
    if(tab==='pending' && !proofOpen) render(); // refresh "overdue" badges
  }
  setInterval(tick, 1000);

  /* ---------- sound / notifications / tab title ---------- */
  let actx;
  function chime(){
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      [660,880,1040].forEach((f,i)=>{
        const o=actx.createOscillator(), g=actx.createGain();
        o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
        const t0=actx.currentTime+i*.18; g.gain.setValueAtTime(.0001,t0);
        g.gain.exponentialRampToValueAtTime(.25,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+.3);
        o.start(t0); o.stop(t0+.32);
      });
    }catch(e){}
  }
  function alertUser(t){
    chime();
    try{ if('Notification' in window && Notification.permission==='granted'){
      const n = new Notification('🐰 Reminder', {body:t.title, requireInteraction:true});
      n.onclick = () => { window.focus(); n.close(); };
    } }catch(e){}
  }
  let blink = 0;
  setInterval(() => { if(dueTasks().length){ document.title = (blink++%2) ? '🐰 Bunny Reminders' : '⏰ REMINDER DUE!'; } }, 1000);
  function askNotifPermission(){
    try{ if('Notification' in window && Notification.permission==='default') Notification.requestPermission().then(updateHint); }catch(e){}
  }
  function updateHint(){
    let msg = '';
    try{
      if(!('Notification' in window)) msg = '';
      else if(Notification.permission==='granted') msg = '🔔 Desktop notifications are on.';
      else if(Notification.permission==='denied') msg = '🔕 Notifications are blocked in your browser – the on-screen bunny popup still works.';
      else msg = '🔔 Allow notifications when asked, so you get alerted even in another window.';
    }catch(e){}
    $('notifHint').textContent = msg;
  }

  /* ---------- proof page ---------- */
  function openProof(id){
    const t = tasks.find(z=>z.id===id); if(!t) return;
    proofFor = id; proofData = null;
    $('pName').textContent = t.title;
    $('dropInner').innerHTML = '<span class="big">🖼️</span>Tap to choose or take a photo';
    $('pSubmit').disabled = true; $('file').value='';
    $('remind').classList.remove('show'); $('proof').classList.add('show');
  }
  $('pCancel').onclick = () => { $('proof').classList.remove('show'); proofFor=null; tick(); };
  $('file').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    if(!f.type.startsWith('image/')){ alert('Please choose an image file 💕'); return; }
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const max = 700, s = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      proofData = c.toDataURL('image/jpeg',.82); URL.revokeObjectURL(url);
      $('dropInner').innerHTML = ''; const p = new Image(); p.src = proofData; $('dropInner').appendChild(p);
      $('pSubmit').disabled = false;
    };
    img.onerror = () => alert('Could not read that photo, try another one.');
    img.src = url;
  };
  $('pSubmit').onclick = () => {
    const t = tasks.find(z=>z.id===proofFor); if(!t || !proofData) return;
    const nowMs = Date.now();
    if(t.repeat!=='Never'){
      // keep a record in Completed, and roll the original to its next date
      tasks.push({id:uid(), title:t.title, due:t.due, repeat:'Never', done:true, proof:proofData, completedAt:nowMs});
      const step = t.repeat==='Daily' ? 1 : 7; let d = new Date(t.due);
      while(d.getTime() <= nowMs) d.setDate(d.getDate()+step);
      t.due = d.getTime(); shownNotif.delete(t.id);
    } else { t.done = true; t.proof = proofData; t.completedAt = nowMs; }
    save(); $('proof').classList.remove('show'); proofFor=null;
    celebrate(); render(); tick();
  };
  function celebrate(){
    const em = ['🌸','⭐','💖','✨','🎀','🌈'];
    for(let i=0;i<26;i++){
      const s=document.createElement('span'); s.className='confetti'; s.textContent=em[i%em.length];
      s.style.left=Math.random()*100+'vw'; s.style.animationDelay=Math.random()*.6+'s';
      document.body.appendChild(s); setTimeout(()=>s.remove(),3200);
    }
  }

  load(); updateHint(); syncTabs(); render(); tick();
})();
</script>
</body>
</html>
